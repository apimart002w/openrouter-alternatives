name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Attribution check
        run: python tools/check_links.py
      - name: Smoke-test the checklist generator
        run: |
          python tools/migrate_checklist.py --dimensions > /dev/null
          python tools/migrate_checklist.py --from openrouter --to per-unit-relay
